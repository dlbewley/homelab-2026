---
# Linux bridge on the spare 'Trunk' NIC of each virtualization node, so VMs can
# attach to lab VLANs directly via NetworkAttachmentDefinitions.
#
# Verified on cnv-1 (2026-07-27) with `ip -brief link`:
#   ens192  UP    00:50:56:b4:ae:17  <- adapter 1, lab-192-168-4-0-b24, br-ex uplink. DO NOT TOUCH.
#   ens224  UP    00:50:56:b4:3e:b1  <- adapter 2, Trunk, holds 192.168.1.33
#   ens256  DOWN  00:50:56:b4:1e:ed  <- adapter 3, Trunk, unused
#   ens161  DOWN  00:50:56:b4:5a:88  <- adapter 4, Trunk, unused
#
# ens161 wass chosen because it is down and unaddressed. Two caveats before you
# enable this (it is commented out of kustomization.yaml until you confirm):
#   1. Interface names were only checked on cnv-1. Confirm cnv-2 and cnv-4 use
#      the same names, or split this into one NNCP per node.
#   2. Grabbing the wrong NIC will cut the node off the network. Never point
#      this at ens192.
#
# ORDERING: the NodeNetworkConfigurationPolicy CRD does not exist until the
# NMState CR in ../../base has been reconciled and the handler has registered
# it. Two annotations are needed to survive that gap:
#
#   sync-wave 10                  applied after the NMState CR in wave 0
#   SkipDryRunOnMissingResource   ArgoCD dry-runs the whole manifest set before
#                                 syncing. Without this, an unknown kind fails
#                                 the dry-run with "one or more synchronization
#                                 tasks are not valid" and aborts the sync —
#                                 including the NMState CR that would have
#                                 created this CRD. That deadlocks: retrying
#                                 never resolves it.
#
# If the CRD is still unregistered when wave 10 runs, the sync fails and the
# normal retry/backoff picks it up once the handler is up.
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: br-vmdata
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  nodeSelector:
    node-role.kubernetes.io/virtualization: ""
  desiredState:
    interfaces:
      - name: br-vmdata
        description: Bridge to the lab Trunk network for VM traffic
        type: ovs-bridge
        state: up
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        bridge:
          allow-extra-patch-ports: true
          options:
            mcast-snooping-enable: true
            stp: false
          port:
            - name: ens224
    ovn:
      bridge-mappings:
        # physicalNetworkName in CUDN/NAD
        - localnet: physnet-vmdata
          bridge: br-vmdata
          state: present
