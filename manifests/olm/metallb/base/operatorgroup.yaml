---
# Empty spec means AllNamespaces install mode, which is the ONLY mode this
# operator supports:
#   oc get packagemanifest metallb-operator -n openshift-marketplace \
#     -o jsonpath='{.status.channels[0].currentCSVDesc.installModes}'
#
# Setting targetNamespaces here requests OwnNamespace, and the operator fails:
#   OwnNamespace InstallModeType not supported, cannot configure to watch own namespace
#
# scripts/verify-channels.sh checks this for every component.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: metallb-operatorgroup
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
