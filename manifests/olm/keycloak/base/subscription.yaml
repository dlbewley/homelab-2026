---
# Red Hat build of Keycloak. Note rhsso-operator also exists in the catalog —
# that is the older Red Hat SSO, superseded by this. Do not use it.
#
# Channel verified against the live hub cluster on 2026-07-31:
#   oc get packagemanifest rhbk-operator -n openshift-marketplace \
#     -o jsonpath='{.status.defaultChannel}'
#   -> stable-v26.6  (rhbk-operator.v26.6.4-opr.1)
#
# The channel is version-pinned, so this does not float across major Keycloak
# releases. Bumping it is a deliberate, reviewable change — check the RHBK
# upgrade notes first, since realm and database migrations are involved.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: rhbk-operator
  channel: stable-v26.6
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
