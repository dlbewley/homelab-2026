---
# Red Hat's Loki Operator, for the optional LokiStack behind Network
# Observability.
#
# TWO PACKAGES SHARE THIS NAME. `loki-operator` exists in both redhat-operators
# (channels stable-6.5/6.6/6.7) and community-operators (channel alpha, v0.12).
# `oc get packagemanifest loki-operator` silently picks one — on the hub it
# returned the community one. The `source` below is what makes this the Red Hat
# build, and scripts/verify-channels.sh looks packages up by `source` for the
# same reason.
#
# Channel verified against the live hub catalog on 2026-11-09:
#   -> stable-6.7  (loki-operator.v6.7.0; default channel of the redhat-operators
#      package)
#
# Version-pinned channel, so this does not float across Loki releases.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: loki-operator
  namespace: openshift-operators-redhat
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: loki-operator
  channel: stable-6.7
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
