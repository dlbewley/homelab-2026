# choice. cnpg-system is the upstream CloudNativePG convention.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
