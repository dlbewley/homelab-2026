---
# AllNamespaces (empty spec), NOT targetNamespaces — the opposite of the
# rhbk-operator next door, and for a concrete reason: the Postgres Clusters this
# operator must manage live in their consumers' namespaces, not here. `keycloak`
# was the first; manifests/config/cloudnative-pg/README.md lists the rest. An
# OwnNamespace install would simply never reconcile them.
#
# Supported modes for this package:
#   OwnNamespace, SingleNamespace, MultiNamespace, AllNamespaces
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cloudnative-pg-operatorgroup
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
