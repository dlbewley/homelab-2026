---
# Channel verified against the live hub cluster on 2026-07-31:
#   oc get packagemanifest openshift-cert-manager-operator -n openshift-marketplace \
#     -o jsonpath='{.status.defaultChannel}'
#   -> stable-v1  (cert-manager-operator.v1.20.0)
# Re-check with scripts/verify-channels.sh after a cluster upgrade.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: openshift-cert-manager-operator
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  config:
    env:
      # ⚠ TECHNOLOGY PREVIEW — enables trust-manager, which the operator ships
      # but does not deploy unless this gate is set. From the operator's own
      # flag help:
      #
      #   --unsupported-addon-features string
      #       List of unsupported addon features that the operator optionally enables.
      #       eg. --unsupported-addon-features="IstioCSR=true"
      #       Note: Technology Preview features are not supported with Red Hat
      #       production service level agreements (SLAs) and might not be
      #       functionally complete. Red Hat does not recommend using them in
      #       production.
      #
      # Accepted here because the alternative is worse: OpenShift needs the
      # homelab CA in a ConfigMap to trust Keycloak and the router, the CA is
      # generated in-cluster, and the only other options are committing a
      # generated certificate to git or copying it by hand. Revisit if a
      # supported mechanism appears, or if homelab-2026-4pq.20 moves the CA to
      # 1Password — a CA certificate that already exists as an artifact could be
      # committed as a ConfigMap without trust-manager at all.
      #
      # Verified on hub 2026-08-07: with this unset the TrustManager CR is
      # created but never reconciled — no operand pod, no status on the CR, and
      # nothing in the operator log mentioning trustmanager.
      - name: UNSUPPORTED_ADDON_FEATURES
        value: TrustManager=true
