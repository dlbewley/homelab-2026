---
# AllNamespaces is the ONLY install mode this operator supports, so `spec: {}`:
#   oc get packagemanifest netobserv-operator -n openshift-marketplace -o json | jq -r \
#     '.status.defaultChannel as $d | .status.channels[]|select(.name==$d)
#      | .currentCSVDesc.installModes|map(select(.supported))|map(.type)|join(", ")'
#   -> AllNamespaces
#
# Named deliberately — the console generates one with a random suffix.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: netobserv-operatorgroup
  namespace: openshift-netobserv-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec: {}
