---
# Network Observability: eBPF flow collection, flow metrics in cluster
# monitoring, and the console's Network Traffic view.
#
# Channel verified against the live hub catalog on 2026-11-09 (OpenShift 4.22):
#   oc get packagemanifest netobserv-operator -n openshift-marketplace \
#     -o jsonpath='{.status.defaultChannel}'
#   -> stable  (network-observability-operator.v2.0.0; the other channel is
#      v1.0.x, a legacy line)
#
# `stable` floats across minor releases — the same as most operators here. The
# FlowCollector API is v1beta2 on this release; re-check the config after an
# upgrade that changes it.
#
# THE OPERATOR ALONE DEPLOYS ONLY ITSELF. Nothing collects flows until the
# FlowCollector in manifests/config/netobserv exists.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: netobserv-operator
  namespace: openshift-netobserv-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  name: netobserv-operator
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
