---
# Builds the Secret maas-api reads from the one CloudNativePG generates.
#
#   maas-db/maas-db-app            (CloudNativePG writes it; key fqdn-uri)
#        │  read by the ClusterSecretStore below
#        ▼
#   redhat-ai-gateway-infra/maas-db-config   key DB_CONNECTION_URL
#        (what maas-api mounts)
#
# No credential is written in this repo and none is kept in 1Password.
# CloudNativePG generates the password; External Secrets copies it, reshaped,
# across the namespace boundary.
#
# Same construction as the cluster pull-secret store in
# manifests/config/external-secrets: the identity and its RBAC live next to the
# Secret they read, and a ClusterSecretStore lets the one consumer add only an
# ExternalSecret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maas-db-reader
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maas-db-reader
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # One Secret, get only.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["maas-db-app"]
    verbs: ["get"]
  # ESO validates a kubernetes-provider store with a SelfSubjectRulesReview.
  # Without this the store never reaches Ready and the message does not mention
  # RBAC.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maas-db-reader
  namespace: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maas-db-reader
subjects:
  - kind: ServiceAccount
    name: maas-db-reader
    namespace: maas-db
---
# A ClusterSecretStore can be referenced from any namespace, and this one opens
# a database password, so `conditions` restricts it to the single namespace
# that has a reason to use it. An ExternalSecret anywhere else is refused.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: maas-db
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  conditions:
    - namespaces:
        - redhat-ai-gateway-infra
  provider:
    kubernetes:
      remoteNamespace: maas-db
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: maas-db
      auth:
        serviceAccount:
          name: maas-db-reader
          namespace: maas-db
---
# RHOAI's "infrastructure namespace", where maas-api runs and looks for its
# database Secret (MaasTenantConfig status.infraNamespace; the default in 3.5).
#
# The maas-controller creates this namespace itself when Models-as-a-Service is
# enabled. It is declared here so the Secret can be in place BEFORE that: Red
# Hat's guide says that when the Secret exists first, maas-api starts cleanly,
# and otherwise it has to be restarted. Server-side apply merges with whatever
# the controller adds; nothing but the name is declared.
#
# Prune=false,Delete=false: this repo does not own the namespace. Removing this
# component must not delete where maas-api lives.
#
# The two coexist. On the hub the controller created the namespace first and
# this declaration merged into it; neither side objected.
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ai-gateway-infra
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
# fqdn-uri, not uri: `uri` uses the short Service name maas-db-rw, which only
# resolves inside the maas-db namespace. maas-api is in another one.
#
# ?sslmode=require is appended because Red Hat's guide gives the URL in that
# form. It encrypts the connection without verifying the server certificate,
# which CloudNativePG signs with its own CA.
#
# The database password is copied once and refreshed hourly. CloudNativePG does
# not rotate it on its own. If it is ever rotated, RHOAI's controller does not
# sync later changes into maas-api, so restart it:
#   oc rollout restart deployment/maas-api -n redhat-ai-gateway-infra
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maas-db-config
  namespace: redhat-ai-gateway-infra
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: maas-db
    kind: ClusterSecretStore
  target:
    name: maas-db-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_CONNECTION_URL: "{{ .uri }}?sslmode=require"
  data:
    - secretKey: uri
      remoteRef:
        key: maas-db-app
        property: fqdn-uri
