---
# The homelab root CA. Signed by selfsigned-bootstrap, then used by the
# homelab-ca ClusterIssuer to sign everything else.
#
# It lives in the `cert-manager` namespace because a ClusterIssuer reads its
# CA secret from the namespace the cert-manager operand runs in, not from the
# namespace of whatever requests a certificate.
#
# TRUST: this CA is what clients must trust. It is generated per cluster, so a
# second cluster produces a second CA to distribute. If that becomes annoying,
# the better pattern is one lab-wide CA keypair held in 1Password and delivered
# to each cluster by External Secrets — the machinery for that is already in
# place. Left simple here because a self-signed root needs no manual bootstrap.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  isCA: true
  commonName: Bewley Homelab CA
  secretName: homelab-ca-tls
  duration: 43800h    # 5 years
  renewBefore: 8760h  # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
