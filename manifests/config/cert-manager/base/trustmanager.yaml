---
# ⚠ TECHNOLOGY PREVIEW. trust-manager ships with the cert-manager operator but
# is not deployed unless UNSUPPORTED_ADDON_FEATURES=TrustManager=true is set on
# the Subscription in manifests/olm/cert-manager. Red Hat states that Technology
# Preview features are not covered by production SLAs, may be functionally
# incomplete, and are not recommended for production. See that Subscription for
# why the trade-off was accepted here.
#
# Without the gate this CR is created and simply never reconciled — no operand,
# no status, and nothing in the operator log. Silent, so check for the pod.
#
# It exists here for one reason: OpenShift's OAuth server must trust the
# certificate Keycloak presents, and that certificate is signed by homelab-ca,
# not a public root. The openID identity provider takes a `ca` reference to a
# ConfigMap in openshift-config — and the CRD is blunt about the failure mode:
#   "If specified and the config map or expected key is not found, the identity
#    provider is not honored."
#
# The CA is generated in-cluster, so committing its PEM to git would couple the
# repo to a generated value and break on rotation. trust-manager distributes it
# instead, from the secret cert-manager already produces.
apiVersion: operator.openshift.io/v1alpha1
kind: TrustManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  trustManagerConfig:
    # Where trust-manager reads source secrets from. homelab-ca-tls lives here.
    trustNamespace: cert-manager
    defaultCAPackage:
      policy: Enabled
    logFormat: text
    logLevel: 1
