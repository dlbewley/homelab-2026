---
# The lab-wide root CA, delivered from 1Password rather than generated here.
#
# WHAT THIS REPLACES
# Previously a selfsigned-bootstrap ClusterIssuer signed a homelab-ca
# Certificate, and every cluster generated its own root. That works with no
# manual step, but N clusters means N roots for clients to trust — which
# defeats the point of using a CA at all.
#
# The existing root was exported rather than a new one generated, so anything
# already trusting `Bewley Homelab CA` keeps working:
#   scripts/export-homelab-ca.sh
#
# THE TRADE-OFF, STATED PLAINLY
# This puts a CA private key in 1Password. That is the cost of a shared root:
# something outside the cluster has to hold it. The 1Password service account
# is scoped to the `eso` vault, and the key is a CONCEALED field.
#
# The upside is not only convenience. A CA that exists as an artifact can be
# rebuilt onto a fresh cluster, whereas an in-cluster generated root is lost
# with the cluster — and every client has to re-trust.
#
# ORDERING CONSEQUENCE, and it is a real one. cert-manager now depends on
# External Secrets and on the 1Password token secret existing. On a fresh
# cluster nothing can be issued until that manual step is done: no CA, no router
# certificate, no OAuth. See the README's rebuild section.
#
# type: kubernetes.io/tls is set through target.template — the CA ClusterIssuer
# reads tls.crt and tls.key, and an Opaque secret would not be accepted.
# Verified against the live cluster before relying on it.
#
# ca.crt duplicates tls.crt, matching what cert-manager itself produced for a
# self-signed root. Nothing here reads it today, but preserving the shape avoids
# surprising anything that expects the conventional trio.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: homelab-ca-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: homelab-ca/tls-crt
    - secretKey: tls.key
      remoteRef:
        key: homelab-ca/tls-key
    - secretKey: ca.crt
      remoteRef:
        key: homelab-ca/tls-crt
