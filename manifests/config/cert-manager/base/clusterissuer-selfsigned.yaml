---
# Bootstrap issuer. Its only job is to sign the homelab root CA below — nothing
# else should reference it.
#
# cert-manager cannot conjure a CA from nothing: something has to sign the root,
# and a self-signed issuer is that something. This is the standard two-step.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selfSigned: {}
