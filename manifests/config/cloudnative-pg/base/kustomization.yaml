apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Config-only component: the operator install lives in manifests/olm/cloudnative-pg.
# Cluster-agnostic — a Postgres Cluster belongs to the component that uses it
# (keycloak's is in manifests/config/keycloak), since that is what owns the
# database. ../README.md lists every consumer.
resources:
  - pull-secret.yaml
