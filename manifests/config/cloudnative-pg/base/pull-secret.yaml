---
# cnpg-pull-secret, minted from the cluster's own pull secret via the shared
# openshift-config-pullsecret ClusterSecretStore in
# manifests/config/external-secrets.
#
# The CloudNativePG operator's own Deployment references this name in
# imagePullSecrets, so kubelet logs FailedToRetrieveImagePullSecret on the
# operator pod when it is absent. The reference comes from the CSV and is not
# something this repo can edit, so satisfying it is the way to silence it.
#
# As with the ACM cases, nothing was broken by its absence: the node-level
# cluster pull secret already covers the registries, and the operator has never
# entered ImagePullBackOff. This is noise removal.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-pull-secret
  namespace: cnpg-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openshift-config-pullsecret
    kind: ClusterSecretStore
  target:
    name: cnpg-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: pull-secret
        property: .dockerconfigjson
