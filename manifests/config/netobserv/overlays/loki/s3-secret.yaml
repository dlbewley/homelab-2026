---
# Reshapes the OBC's credentials into the Secret a LokiStack reads.
#
#   netobserv/netobserv-loki   (OBC writes it; AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
#        │  read by the SecretStore below
#        ▼
#   netobserv/loki-s3          bucketnames, endpoint, access_key_id, access_key_secret
#
# No credential is written in this repo or kept in 1Password: ODF generates it,
# External Secrets copies it under the key names Loki expects. Same construction
# as manifests/config/maas-database, except namespaced — source and target share
# a namespace, so a plain SecretStore is enough and nothing else can use it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-s3-reader
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: loki-s3-reader
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # One Secret, get only.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["netobserv-loki"]
    verbs: ["get"]
  # ESO validates a kubernetes-provider store with a SelfSubjectRulesReview.
  # Without this the store never reaches Ready and the message does not mention
  # RBAC.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: loki-s3-reader
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: loki-s3-reader
subjects:
  - kind: ServiceAccount
    name: loki-s3-reader
    namespace: netobserv
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: loki-s3
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    kubernetes:
      remoteNamespace: netobserv
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: loki-s3-reader
---
# endpoint is the MCG S3 Service inside the cluster. Its certificate is signed by
# the OpenShift service CA, which the LokiStack trusts via spec.storage.tls.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: netobserv
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: loki-s3
    kind: SecretStore
  target:
    name: loki-s3
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        bucketnames: netobserv-loki
        endpoint: https://s3.openshift-storage.svc:443
        access_key_id: "{{ .access_key_id }}"
        access_key_secret: "{{ .access_key_secret }}"
  data:
    - secretKey: access_key_id
      remoteRef:
        key: netobserv-loki
        property: AWS_ACCESS_KEY_ID
    - secretKey: access_key_secret
      remoteRef:
        key: netobserv-loki
        property: AWS_SECRET_ACCESS_KEY
