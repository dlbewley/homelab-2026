---
# Registers one model with Models-as-a-Service: qwen2.5-7b-instruct, served by
# LM Studio on the Mac "blackout".
#
# Three objects in the model namespace, in the order MaaS needs them:
#
#   ExternalProvider   where the provider is and how to authenticate to it
#   ExternalModel      a model name clients ask for, mapped onto that provider
#   MaaSModelRef       puts the model in the MaaS catalog
#
# From these the controller generates the plumbing itself: an ExternalName
# Service, an Istio ServiceEntry and an HTTPRoute on the MaaS gateway. Who may
# use the model, and how much, is in lmstudio-qwen-access.yaml.

# NOT WORKING YET, AND NOT BECAUSE OF ANYTHING IN THIS FILE. All three objects
# reconcile to Ready, but RHOAI 3.5.1 connects to every external provider the
# same way — TLS, port 443, certificate checked against public CAs — and LM
# Studio serves plain HTTP on 1234. See ../../README.md, "What RHOAI 3.5.1
# requires of an external model". The registration is left in place because
# whatever puts TLS in front of LM Studio changes at most `endpoint` below.

# WHERE AND HOW. `provider: openai` because LM Studio speaks the OpenAI API: the
# payload processor passes the request body through unchanged and sends the
# credential as `Authorization: Bearer`.
#
# endpoint is a hostname only: no scheme, port or path. The port is always 443.
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: lmstudio-blackout
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider: openai
  endpoint: blackout.home.bewley.net
  auth:
    type: apikey
    secretRef:
      # From 1Password; see externalsecret-lmstudio.yaml.
      name: lmstudio-blackout-api-key
---
# THE MODEL.
#
# THREE NAMES, and on RHOAI 3.5.1 clients use the FIRST:
#   metadata.name  qwen2-5-7b-instruct     what the MaaS catalog lists and the
#                                          gateway routes on. A resource name
#                                          cannot contain the dot.
#   modelName      qwen2.5-7b-instruct     meant to be the client-facing name;
#                                          asking for it returned 404 here
#   targetModel    qwen2.5-7b-instruct-1m  what LM Studio calls it — its exact
#                                          model key. Check with `lms ls`.
#
# NO PORT OR TLS ANNOTATIONS. Red Hat's guide documents maas.opendatahub.io/port
# and maas.opendatahub.io/tls on this object for exactly this case. On 3.5.1 they
# are ignored: the generated Service, ServiceEntry and DestinationRule are 443
# and TLS regardless. They were tried here and removed so the manifest does not
# claim something that is not happening.
#
# weight 100 with a single provider. Several providerRefs would split traffic.
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: qwen2-5-7b-instruct
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  modelName: qwen2.5-7b-instruct
  externalProviderRefs:
    - ref:
        name: lmstudio-blackout
      targetModel: qwen2.5-7b-instruct-1m
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 100
---
# THE CATALOG ENTRY. Without this the model exists but MaaS does not list it and
# nothing can subscribe to it. No tenantRef, so it belongs to the default
# tenant — the only one external models are supported for in this release.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: qwen2-5-7b-instruct
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  modelRef:
    kind: ExternalModel
    name: qwen2-5-7b-instruct
