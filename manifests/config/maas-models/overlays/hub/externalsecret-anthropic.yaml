---
# The Anthropic API key Models-as-a-Service uses to call Claude.
#
# MaaS clients never see it. They authenticate to MaaS with their own MaaS API
# key, and the gateway's payload processor swaps this one in on the way out, as
# an `Authorization: Bearer` header.
#
#   1Password  eso / Anthropic / rhoai
#        │  ClusterSecretStore 1password-sdk
#        ▼
#   maas-models/anthropic-api-key     key: api-key
#
# Same required shape as the LM Studio token next door: data key `api-key`, the
# label inference.llm-d.ai/ipp-managed, and the ExternalProvider's namespace.
#
# THIS KEY SPENDS MONEY. Everything that reaches it does so through a MaaS
# subscription, and the token limit there is the spending cap. See
# access-homelab-admins.yaml.
#
# To rotate: create a new key in the Anthropic Console, update the 1Password
# item, and External Secrets picks it up within the hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-api-key
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: anthropic-api-key
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          inference.llm-d.ai/ipp-managed: "true"
      data:
        api-key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        # <item>/<field>, in the store's vault.
        key: Anthropic/rhoai
