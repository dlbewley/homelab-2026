---
# Turns on RESPONSE translation in the MaaS gateway's payload processor, which
# the Anthropic model needs and which RHOAI ships switched off.
#
# The payload processor translates an OpenAI Chat Completions request into
# Anthropic's Messages format on the way out. Translating the answer back is a
# separate plugin step, off by default, so that streamed responses from
# OpenAI-compatible models are not held up by a response processor. With it
# off, an OpenAI-style client asking for claude-haiku-5-5 would get an
# Anthropic-shaped answer it cannot parse.
#
# THE ONLY CHANGE from what RHOAI 3.5.1 generates is the last block:
#     response: []      ->      response: [api-translation]
# The trade is the one the default avoids: every response now passes through
# the translator, including streamed ones.
#
# THE ConfigMap BELONGS TO RHOAI (owner: Config/default). RHOAI creates it,
# stamps it opendatahub.io/managed: "false", and from then on leaves edits
# alone — so this is the supported way to change it. Server-side apply owns
# just this one key; the pre-processing key beside it stays RHOAI's.
# Prune=false,Delete=false: removing this file must not delete the ConfigMap.
#
# TWO THINGS THAT FOLLOW FROM THAT:
#   - Because RHOAI no longer manages it, an RHOAI upgrade will NOT update this
#     content either. After an upgrade, compare it with what a fresh install
#     generates (the plugin list may change) and carry this one edit across.
#   - The payload processor reads it at start-up. After this changes:
#       oc rollout restart deployment/payload-processing -n openshift-ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: payload-processing-plugins
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
data:
  custom-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: maas-headers-guard
      name: maas-headers-guard
    - type: stream-usage-enforcer
    - type: model-provider-resolver
    - type: api-translation
    - type: apikey-injection
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: maas-headers-guard
        - pluginRef: stream-usage-enforcer
        - pluginRef: model-provider-resolver
        - pluginRef: api-translation
        - pluginRef: apikey-injection
        # Off in RHOAI's default. On here for the Anthropic model: translates
        # Messages-format answers back to OpenAI format for OpenAI-style
        # clients. See the comment at the top of this file.
        response:
        - pluginRef: api-translation
