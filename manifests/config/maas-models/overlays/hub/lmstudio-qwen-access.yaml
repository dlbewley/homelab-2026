---
# Who may use qwen2.5-7b-instruct through Models-as-a-Service, and how much.
#
# MaaS denies by default: a model nobody has been granted returns 403, and a
# user with no subscription gets zero tokens. Both objects below are needed.
#
# They live in models-as-a-service, RHOAI's tenant namespace, not next to the
# model. That is where the controller looks for them.

# ACCESS. Any one matching subject is enough.
#
# cluster-admins is the conservative start: it is the one populated group on the
# hub (bootstrap/rbac.yaml). To open the model to everyone who can log in, add
# `- name: system:authenticated`. Keycloak's groups are not synced into
# OpenShift, so they cannot be named here yet.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: qwen2-5-7b-instruct
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  modelRefs:
    - name: qwen2-5-7b-instruct
      namespace: maas-models
  subjects:
    groups:
      - name: cluster-admins
---
# QUOTA. A subscription is what an API key is issued against, and it carries the
# token budget.
#
# 200,000 tokens an hour is a starting figure, not a measured one: roomy for one
# person experimenting, small enough that a runaway agent loop is stopped by
# MaaS rather than by the laptop's fans. Exceeding it returns 429 until the
# window rolls over. Windows are s, m or h; days are not accepted.
#
# The owner groups decide who may create API keys on this subscription.
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: lmstudio-local
  namespace: models-as-a-service
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  owner:
    groups:
      - name: cluster-admins
  modelRefs:
    - name: qwen2-5-7b-instruct
      namespace: maas-models
      tokenRateLimits:
        - limit: 200000
          window: 1h
