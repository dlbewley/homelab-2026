apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No base: which models a cluster fronts, and where they are served from, is
# inherently cluster-specific. Same reasoning as manifests/config/node-labels.
resources:
  - namespace.yaml
  # Shared by every model: access and quota.
  - access-homelab-admins.yaml
  # Claude Haiku 4.5 and 5.5 on Anthropic's API.
  - externalsecret-anthropic.yaml
  - anthropic-haiku.yaml
  # gpt-6-luna on OpenAI's API.
  - externalsecret-openai.yaml
  - openai-gpt.yaml
  # qwen2.5-7b-instruct on LM Studio. Registered, not yet reachable.
  - externalsecret-lmstudio.yaml
  - lmstudio-qwen.yaml
