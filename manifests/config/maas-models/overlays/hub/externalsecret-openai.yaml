---
# The OpenAI API key Models-as-a-Service uses to call OpenAI.
#
# MaaS clients never see it. They authenticate to MaaS with their own MaaS API
# key, and the gateway's payload processor swaps this one in on the way out, as
# an `Authorization: Bearer` header.
#
#   1Password  eso / OpenAI / token
#        │  ClusterSecretStore 1password-sdk
#        ▼
#   maas-models/openai-api-key     key: api-key
#
# Same required shape as the other provider credentials here: data key
# `api-key`, the label inference.llm-d.ai/ipp-managed, and the
# ExternalProvider's namespace.
#
# THIS KEY SPENDS MONEY. Everything that reaches it does so through a MaaS
# subscription, and the token limit there is the spending cap. See
# access-homelab-admins.yaml.
#
# To rotate: create a new key in the OpenAI dashboard, update the 1Password
# item, and External Secrets picks it up within the hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openai-api-key
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: openai-api-key
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          inference.llm-d.ai/ipp-managed: "true"
      data:
        api-key: "{{ .key }}"
  data:
    - secretKey: key
      remoteRef:
        # <item>/<field>, in the store's vault.
        key: OpenAI/token
