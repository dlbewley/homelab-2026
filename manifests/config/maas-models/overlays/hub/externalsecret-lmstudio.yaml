---
# The API token for LM Studio on the Mac "blackout", which Models-as-a-Service
# will front as its first model.
#
# LM Studio's server requires a bearer token (it answers 401 without one). MaaS
# clients never see it: they authenticate to MaaS with their own MaaS API key,
# and the gateway's payload processor swaps in this token on the way out.
#
#   1Password  eso / LM Studio / tokens / blackout
#        │  ClusterSecretStore 1password-sdk
#        ▼
#   maas-models/lmstudio-blackout-api-key    key: api-key
#        ▲
#        └─ read by the payload processor when a request is routed to the model
#
# THE SHAPE IS DICTATED BY MaaS, per Red Hat's guide:
#   - the data key must be `api-key`
#   - the Secret must carry the label inference.llm-d.ai/ipp-managed: "true",
#     or the payload processor will not read it and requests fail with
#     "credentials not found"
#   - it must be in the same namespace as the ExternalProvider that names it
#
# THE ITEM MUST BE IN THE `eso` VAULT. The 1password-sdk store reads exactly one
# vault, and the cluster's service account can see only that one. The token was
# first saved at op://development/LM Studio/tokens/blackout, which the cluster
# cannot read. The key below is the same item/section/field path, resolved in
# `eso`. Until an item of that name exists there, this ExternalSecret reports
# SecretSyncedError and nothing else is affected.
#
# If the token is regenerated in LM Studio, update the 1Password item; External
# Secrets picks it up within the hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lmstudio-blackout-api-key
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: lmstudio-blackout-api-key
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          inference.llm-d.ai/ipp-managed: "true"
      data:
        api-key: "{{ .token }}"
  data:
    - secretKey: token
      remoteRef:
        # <item>/<section>/<field>, in the store's vault. Every other key in
        # this repo is the two-part <item>/<field>; the three-part form with a
        # section in the middle works through this store too.
        key: LM Studio/tokens/blackout
