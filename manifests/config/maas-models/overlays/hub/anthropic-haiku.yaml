---
# Registers two Claude Haiku models, served by Anthropic's API, with
# Models-as-a-Service.
#
# Anthropic is the kind of provider RHOAI 3.5.1 is built for: public TLS on port
# 443 with a certificate from a public CA.
#
# BOTH MODELS GO THROUGH ANTHROPIC'S OpenAI-COMPATIBLE ENDPOINT
# (api.anthropic.com/v1/chat/completions), NOT its native Messages API. That is
# a deliberate retreat from the first version of this file, which used the
# native API and had the gateway translate. On RHOAI 3.5.1 that translation
# cannot stream: a streamed reply came back as one JSON object mislabelled as
# an event stream, and the native dialect was rejected outright when streamed.
# The Gen AI playground streams every reply, so it could not use the model at
# all. With an OpenAI-compatible provider the gateway translates nothing: the
# provider already speaks the dialect the clients do, streaming included.
#
# What that costs: clients can no longer use Anthropic's native /v1/messages
# dialect through MaaS, and Anthropic documents its OpenAI-compatible endpoint
# as a compatibility layer rather than its full API (no prompt caching, some
# OpenAI fields ignored). Fine for a lab; revisit when RHOAI's translator can
# stream.

# `provider: openai` makes the gateway send the credential as
# `Authorization: Bearer`, which this endpoint accepts, and pass request and
# response bodies through untouched.
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: anthropic-openai
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider: openai
  endpoint: api.anthropic.com
  auth:
    type: apikey
    secretRef:
      # From 1Password; see externalsecret-anthropic.yaml.
      name: anthropic-api-key
---
# Claude Haiku 4.5: THE ONE THE Gen AI PLAYGROUND CAN USE.
#
# The playground sends a `temperature` with every request and cannot be told
# not to. Haiku 4.5 accepts one; Haiku 5.5 answers 400, "`temperature` is
# deprecated for this model". That is the whole reason this older model is
# here.
#
# It costs ten times what Haiku 5.5 does per token; see the budget in
# access-homelab-admins.yaml.
#
# THE NAME CLIENTS USE IS metadata.name. On RHOAI 3.5.1 the catalog lists a
# model by its resource name and the gateway routes on that, not on
# spec.modelName. Here all three names are Anthropic's own ID, which is
# complete as written and takes no date suffix.
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: claude-haiku-4-5
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  modelName: claude-haiku-4-5
  externalProviderRefs:
    - ref:
        name: anthropic-openai
      targetModel: claude-haiku-4-5
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 100
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: claude-haiku-4-5
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  modelRef:
    kind: ExternalModel
    name: claude-haiku-4-5
---
# Claude Haiku 5.5: the current Haiku, a tenth of the price, for clients that
# can leave sampling settings alone.
#
# DO NOT SEND temperature, top_p OR top_k. It rejects any of them with a 400.
# Many OpenAI clients send temperature by default, and the Gen AI playground
# always does, so it cannot use this model.
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: claude-haiku-5-5
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  modelName: claude-haiku-5-5
  externalProviderRefs:
    - ref:
        name: anthropic-openai
      targetModel: claude-haiku-5-5
      apiFormat: openai-chat
      path: /v1/chat/completions
      weight: 100
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: claude-haiku-5-5
  namespace: maas-models
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  modelRef:
    kind: ExternalModel
    name: claude-haiku-5-5
