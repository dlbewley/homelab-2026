---
# The public name of the Models-as-a-Service gateway on the hub.
#
# Reencrypt: the router terminates the client's TLS with its own wildcard
# certificate (*.apps.hub.lab.bewley.net, from homelab-ca) and opens a second
# TLS connection to the gateway, which serves a service-ca certificate.
#
# NO destinationCACertificate, on purpose. Without one the router validates the
# backend against its own destination CA and the Service's cluster hostname,
# which is exactly what a service-ca certificate satisfies. Pasting the service
# CA in here would put a cluster-specific, rotating value in git.
#
# The Service name is <gateway-name>-<gatewayclass-name>, generated by the
# gateway controller. If either name changes, so must this.
#
# haproxy.router.openshift.io/timeout: the router gives a backend 30 seconds to
# start responding by default (the IngressController's serverTimeout). A large
# model answering a long prompt without streaming can exceed that, and the
# client would see a 504 from the router rather than an answer. Five minutes
# matches the timeout the MaaS payload processor uses for its own calls. It is a
# first guess to be tuned against real generations, not a measured value.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: maas-gateway-route
  namespace: openshift-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: maas.apps.hub.lab.bewley.net
  to:
    kind: Service
    name: maas-default-gateway-openshift-default
    weight: 100
  port:
    targetPort: 443
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
