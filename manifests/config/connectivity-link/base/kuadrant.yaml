---
# The Kuadrant instance. Creating it is what makes the operator deploy Authorino
# (authentication and authorization) and Limitador (rate limiting); until it
# exists the policy CRDs are installed but nothing enforces them.
#
# No spec, exactly as Red Hat's install guide has it. The name and namespace are
# what RHOAI's Models-as-a-Service looks for: a Kuadrant named `kuadrant` in
# kuadrant-system, Ready.
#
# The CRD arrives with the operator's CSV, so this Application fails and retries
# until manifests/olm/connectivity-link has installed.
#
# spec.observability.enable makes the operator create PodMonitors for Limitador,
# Authorino and its own controllers (kuadrant-limitador-monitor and friends, in
# kuadrant-system). It is step one of Red Hat's procedure for the
# Models-as-a-Service usage dashboard; the rest is in manifests/config/rhoai.
# kuadrant-system deliberately has no openshift.io/cluster-monitoring label, so
# it is user workload monitoring that picks these up, and the metrics are
# queryable in the console under Observe > Metrics.
#
# The operator had already written an empty `observability: {}` into the spec;
# this adds one field beneath it.
apiVersion: kuadrant.io/v1beta1
kind: Kuadrant
metadata:
  name: kuadrant
  namespace: kuadrant-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  observability:
    enable: true
