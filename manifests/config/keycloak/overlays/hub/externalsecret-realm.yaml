---
# Secrets the realm import needs, pulled from 1Password rather than committed.
#
# Seven values, all from one 1Password item named `keycloak-homelab` in the
# `eso` vault:
#
#   OCP_HUB_CLIENT_SECRET   shared secret between the ocp-hub OIDC client and
#                           OpenShift's OAuth server. OpenShift's openID identity
#                           provider requires one — a public/PKCE client is not
#                           an option, verified against the API:
#                             spec.identityProviders[0].openID.clientSecret.name: Required value
#                           The same value will be needed again as a Secret in
#                           openshift-config when the OAuth CR is wired up
#                           (homelab-2026-4pq.8). One source, two consumers.
#   HOMELAB_ADMIN_PASSWORD  password for dlbewley, the cluster-admins account.
#   DEV1/DEV2/DEV3/ALICE/BOB_PASSWORD
#                           test accounts in the `developers` group. One password
#                           each rather than a shared one, so a single account can
#                           be rotated or revoked without disturbing the others.
#
# MANUAL STEP: create the item before this can resolve.
#
#   scripts/create-keycloak-realm-secrets.sh --dry-run   # show what it will make
#   scripts/create-keycloak-realm-secrets.sh             # create it
#
# REMOTEREF FORMAT: the onepasswordSDK provider takes a single reference of the
# form <item>/[section/]<field> — NOT an item name plus a separate `property:`,
# which is the 1Password *Connect* provider's shape. ESO prepends op://<vault>/
# using the vault configured on the ClusterSecretStore, so the vault is not
# repeated here.
#
# Getting this wrong fails loudly, at least:
#   error resolving secret reference: the secret reference could not be parsed:
#   secret reference has invalid format - must be
#   "op://<vault>/<item>/[section/]field[?attribute=<attribute-value>]"
# because `property` is ignored and the constructed URI ends up with no field.
#
# The field names below must match the 1Password item, which the script creates
# exactly. Change one without the other and the mismatch shows up only as an
# unsynced key.
#
# DO NOT reach for `op item create` with assignment statements instead.
# Assignments take LITERAL values, so
#   op item create ... 'dev1-password[password]=generate'
# stores the string "generate" in every field — no error, item created,
# ExternalSecret synced, realm imported, every password the word "generate".
# `--generate-password` does generate a value, but only for an item's single
# built-in password field, never custom ones. The script exists because of this.
#
# Read one back when you need to log in as that account:
#   op read 'op://eso/keycloak-homelab/dev1-password'
#
# Until the item exists this reports SecretSyncedError and the realm import
# waits — expected order, not a fault. A missing or misnamed field fails only
# its own key, but that still leaves the whole ExternalSecret unsynced.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-realm-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: homelab-realm-secrets
    creationPolicy: Owner
  data:
    - secretKey: OCP_HUB_CLIENT_SECRET
      remoteRef:
        key: keycloak-homelab/ocp-hub-client-secret
    - secretKey: HOMELAB_ADMIN_PASSWORD
      remoteRef:
        key: keycloak-homelab/admin-password
    # Test accounts, one password each rather than a shared one.
    - secretKey: DEV1_PASSWORD
      remoteRef:
        key: keycloak-homelab/dev1-password
    - secretKey: DEV2_PASSWORD
      remoteRef:
        key: keycloak-homelab/dev2-password
    - secretKey: DEV3_PASSWORD
      remoteRef:
        key: keycloak-homelab/dev3-password
    - secretKey: ALICE_PASSWORD
      remoteRef:
        key: keycloak-homelab/alice-password
    - secretKey: BOB_PASSWORD
      remoteRef:
        key: keycloak-homelab/bob-password
