---
# Secrets the realm import needs, pulled from 1Password rather than committed.
#
# Two values, one 1Password item:
#   OCP_HUB_CLIENT_SECRET   shared secret between the ocp-hub OIDC client and
#                           OpenShift's OAuth server. OpenShift's openID identity
#                           provider requires one — a public/PKCE client is not
#                           an option, verified against the API:
#                             spec.identityProviders[0].openID.clientSecret.name: Required value
#                           The same value will be needed again as a Secret in
#                           openshift-config when the OAuth CR is wired up
#                           (homelab-2026-4pq.8). One source, two consumers.
#   HOMELAB_ADMIN_PASSWORD  initial password for the local realm user.
#
# MANUAL STEP: create the 1Password item before this can resolve. In the `eso`
# vault, an item named `keycloak-homelab` carrying one field per value below.
# `op` generates strong values itself, so nothing has to be invented:
#
#   op item create --category=login --vault=eso --title=keycloak-homelab \
#     'ocp-hub-client-secret[password]=generate' \
#     'admin-password[password]=generate' \
#     'dev1-password[password]=generate' \
#     'dev2-password[password]=generate' \
#     'dev3-password[password]=generate' \
#     'alice-password[password]=generate' \
#     'bob-password[password]=generate'
#
# Read one back when you need to log in as that account:
#   op read 'op://eso/keycloak-homelab/dev1-password'
#
# A missing field fails only that key, so an incomplete item leaves the whole
# ExternalSecret unsynced and the realm import waiting.
#
# Until it exists this ExternalSecret reports SecretSyncedError and the realm
# import waits. That is the expected order, not a fault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-realm-secrets
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: homelab-realm-secrets
    creationPolicy: Owner
  data:
    - secretKey: OCP_HUB_CLIENT_SECRET
      remoteRef:
        key: keycloak-homelab
        property: ocp-hub-client-secret
    - secretKey: HOMELAB_ADMIN_PASSWORD
      remoteRef:
        key: keycloak-homelab
        property: admin-password
    # Test accounts, one password each rather than a shared one.
    - secretKey: DEV1_PASSWORD
      remoteRef:
        key: keycloak-homelab
        property: dev1-password
    - secretKey: DEV2_PASSWORD
      remoteRef:
        key: keycloak-homelab
        property: dev2-password
    - secretKey: DEV3_PASSWORD
      remoteRef:
        key: keycloak-homelab
        property: dev3-password
    - secretKey: ALICE_PASSWORD
      remoteRef:
        key: keycloak-homelab
        property: alice-password
    - secretKey: BOB_PASSWORD
      remoteRef:
        key: keycloak-homelab
        property: bob-password
