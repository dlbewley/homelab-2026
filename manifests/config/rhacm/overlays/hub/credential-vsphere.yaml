---
# ACM cluster-lifecycle Credential for the lab vCenter, assembled from two
# stores plus literals. Nothing secret is in this file.
#
# An ACM Credential is an ordinary Opaque Secret; the two labels are what make it
# appear under Credentials in the console. Get them wrong and you get a Secret
# that exists and is never offered when creating a cluster — the usual quiet
# failure, so the acceptance test is the console listing, not `oc get secret`.
#
# TWO SOURCES IN ONE SECRET, via spec.data[].sourceRef.storeRef:
#   pullSecret                  openshift-config/pull-secret, through the shared
#                               openshift-config-pullsecret ClusterSecretStore
#   username/password/CA, SSH   1password-sdk
# Without per-entry sourceRef this would need two ExternalSecrets writing one
# Secret, which ESO does not do cleanly.
#
# WHAT IS AND IS NOT A SECRET. vCenter hostname, datacenter, cluster, datastore
# and baseDomain are topology, not credentials — they belong in git where they
# are reviewable, not in a vault. Only the four values that would grant access
# come from a store.
#
# The empty optional fields are kept to match what the ACM console itself
# produces for a vmw credential, so this Secret is shaped exactly like a
# hand-created one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vsphere-lab
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  # Default store; the pullSecret entry overrides it below.
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: vsphere-lab
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          # Both are required for the console to treat this as a Credential.
          cluster.open-cluster-management.io/type: vmw
          cluster.open-cluster-management.io/credentials: ""
      data:
        # --- topology, not secret ---
        vCenter: vcenter.lab.bewley.net
        datacenter: Garden
        cluster: Goat
        defaultDatastore: VMData
        baseDomain: lab.bewley.net
        # --- from 1Password ---
        username: "{{ .username }}"
        password: "{{ .password }}"
        cacertificate: "{{ .cacertificate }}"
        ssh-privatekey: "{{ .sshPrivateKey }}"
        ssh-publickey: "{{ .sshPublicKey }}"
        # --- from the cluster's own pull secret ---
        pullSecret: "{{ .pullSecret }}"
        # --- optional, present and empty to match the console's shape ---
        vsphereFolder: ""
        vsphereResourcePool: ""
        vsphereDiskType: ""
        clusterOSImage: ""
        imageContentSources: ""
        disconnectedAdditionalTrustBundle: ""
        httpProxy: ""
        httpsProxy: ""
        noProxy: ""
        additionalTrustBundle: ""
  data:
    - secretKey: username
      remoteRef: {key: vcenter/username}
    - secretKey: password
      remoteRef: {key: vcenter/password}
    # The CA that signs vcenter's TLS cert. vCenter serves only its leaf, so this
    # came from its /certs/download.zip bundle — of the four CAs in there, only
    # this one verifies the leaf (openssl verify), fingerprint A5:0F:C9:3E:…
    # It expires 2036-05-06; a VMCA regeneration before then means updating the
    # 1Password field, and the symptom would be ACM unable to reach vCenter.
    - secretKey: cacertificate
      remoteRef: {key: vcenter/cacertificate}
    # Field labels containing spaces are fine in remoteRef.
    - secretKey: sshPrivateKey
      remoteRef: {key: acm/private key}
    - secretKey: sshPublicKey
      remoteRef: {key: acm/public key}
    - secretKey: pullSecret
      sourceRef:
        storeRef:
          name: openshift-config-pullsecret
          kind: ClusterSecretStore
      remoteRef: {key: pull-secret, property: .dockerconfigjson}
