---
# Persistent storage for the Search service's PostgreSQL database.
#
# Without this the search database runs on ephemeral storage, so the index is
# lost whenever the pod restarts and has to be rebuilt from every managed
# cluster. Docs: "Customize the search service" in the RHACM 2.17 search guide.
#
# WHY ONLY dbStorage IS DECLARED
# The Search CR named search-v2-operator is created by ACM itself when the
# search component comes up — it is not ours to own. So this declares the one
# field we care about and lets server-side apply merge it in, the same partial
# apply used for the StorageClass defaults, the IngressController and
# proxy/cluster.
#
# That also makes the manifest correct either way: if ACM has already created
# the CR, SSA merges dbStorage into it; if it has not, SSA creates it with just
# this field, which the CRD permits since spec.dbStorage has no required
# properties.
#
# Prune=false,Delete=false because deleting this file must never remove ACM's
# Search CR and take the search service down with it.
#
# STORAGE CLASS IS DELIBERATELY OMITTED, and that is permitted — the CRD marks
# neither field required:
#   spec.dbStorage.storageClassName  type: string, no default
#   spec.dbStorage.size              default: 10Gi
# Omitting it means the PVC is created without a class and Kubernetes uses the
# cluster default, which manifests/config/odf sets to
# ocs-storagecluster-ceph-rbd. Naming the class here would hard-code an
# ODF-specific value into a base that is otherwise cluster-agnostic, and would
# silently disagree with any cluster whose default differs.
#
# size is set explicitly even though 10Gi is already the CRD default, so the
# intent is visible in git rather than inherited from a schema that could change
# between releases.
#
# SkipDryRunOnMissingResource because the Search CRD does not exist until ACM
# deploys the search component, which happens after MultiClusterHub is Running.
# Without it the unknown kind fails ArgoCD's dry-run and aborts the whole sync.
apiVersion: search.open-cluster-management.io/v1alpha1
kind: Search
metadata:
  name: search-v2-operator
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
spec:
  dbStorage:
    size: 10Gi
