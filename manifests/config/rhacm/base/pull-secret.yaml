---
# multiclusterhub-operator-pull-secret, minted from the cluster's own pull secret
# via the shared openshift-config-pullsecret ClusterSecretStore declared in
# manifests/config/external-secrets.
#
# The identity and RBAC live there, in openshift-config. This namespace holds
# only the request, not the credential that satisfies it.
#
# MCH names this Secret in spec.imagePullSecret. Note that setting it does NOT
# propagate the Secret to other namespaces — verified on hub 2026-08-16: with
# MCH pointing here and the Secret present, open-cluster-management-observability
# still had no copy and kubelet kept warning. Every namespace that needs it
# declares its own ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multiclusterhub-operator-pull-secret
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openshift-config-pullsecret
    kind: ClusterSecretStore
  target:
    name: multiclusterhub-operator-pull-secret
    creationPolicy: Owner
    template:
      # Must be dockerconfigjson, not Opaque — kubelet ignores an imagePullSecret
      # of the wrong type without reporting that the type is why.
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: pull-secret
        property: .dockerconfigjson
