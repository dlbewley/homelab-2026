---
# multiclusterhub-operator-pull-secret, built from the cluster's own pull secret.
#
# WHY openshift-config RATHER THAN 1Password. The rule this repo follows: if the
# cluster already holds an authoritative copy, read it from the cluster;
# 1Password is for credentials with no in-cluster source. openshift-config/
# pull-secret is guaranteed present — OpenShift cannot install without it — so
# there is no setup step and no bootstrap ordering problem, and refreshing it
# from console.redhat.com propagates here automatically rather than drifting
# against a second copy in a vault.
#
# This is the redhat-cop catalog's SOURCE choice with its MECHANISM rejected. The
# objection to its setup Job was imperative execution and a ClusterRole granting
# secrets get/list/create/patch at cluster scope — never where it read from.
#
# WHAT THIS FIXES: 39 pods in open-cluster-management-observability and 1 in
# cnpg-system reference pull secrets that do not exist, so kubelet logs a warning
# per pod. Nothing is broken — the node-level cluster pull secret already covers
# registry.redhat.io, and no pod is in ImagePullBackOff — but 40 warnings is the
# noise that hides the next real failure.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pull-secret-reader
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
# The Role lives where the SOURCE Secret is, not where the ServiceAccount is.
# Cross-namespace binding is fine and is the point: nothing in
# open-cluster-management gains any new power, and the grant is one Secret, get
# only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhacm-pull-secret-reader
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pull-secret"]
    verbs: ["get"]
  # ESO validates a kubernetes-provider store with a SelfSubjectRulesReview.
  # Without this the SecretStore never reaches Ready, and the failure message
  # does not mention RBAC.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhacm-pull-secret-reader
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhacm-pull-secret-reader
subjects:
  - kind: ServiceAccount
    name: pull-secret-reader
    namespace: open-cluster-management
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openshift-config-pullsecret
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    kubernetes:
      remoteNamespace: openshift-config
      server:
        # kube-root-ca.crt is injected into every namespace, so the API server's
        # CA needs no ExternalSecret of its own.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: pull-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multiclusterhub-operator-pull-secret
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openshift-config-pullsecret
    kind: SecretStore
  target:
    name: multiclusterhub-operator-pull-secret
    creationPolicy: Owner
    template:
      # Must be dockerconfigjson, not Opaque — kubelet ignores an imagePullSecret
      # of the wrong type without complaining that the type is why.
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: pull-secret
        # property selects one key out of the source Secret.
        property: .dockerconfigjson
