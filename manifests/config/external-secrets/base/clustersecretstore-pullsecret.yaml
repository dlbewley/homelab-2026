---
# Reads the cluster's OWN pull secret, so any namespace can mint a copy.
#
# WHY THIS IS SHARED INFRASTRUCTURE RATHER THAN PER-COMPONENT. Three namespaces
# need the same Secret under three different names:
#   open-cluster-management                multiclusterhub-operator-pull-secret
#   open-cluster-management-observability  multiclusterhub-operator-pull-secret
#   cnpg-system                            cnpg-pull-secret
# A namespaced SecretStore would mean duplicating a ServiceAccount, Role,
# RoleBinding and SecretStore into each one. A ClusterSecretStore is declared
# once and each consumer adds only an ExternalSecret.
#
# The identity and its RBAC live entirely in openshift-config, next to the Secret
# they read. Nothing in the consuming namespaces gains any power: they reference
# a cluster-scoped store, they do not hold the credential that opens it.
#
# In base/ rather than overlays/ because every OpenShift cluster has
# openshift-config/pull-secret — install cannot complete without it — so this
# needs no per-cluster values, unlike the 1password store next to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pull-secret-reader
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pull-secret-reader
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # One Secret, get only.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["pull-secret"]
    verbs: ["get"]
  # ESO validates a kubernetes-provider store with a SelfSubjectRulesReview.
  # Without this the store never reaches Ready and the message does not mention
  # RBAC.
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pull-secret-reader
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pull-secret-reader
subjects:
  - kind: ServiceAccount
    name: pull-secret-reader
    namespace: openshift-config
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openshift-config-pullsecret
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    kubernetes:
      remoteNamespace: openshift-config
      server:
        # A ClusterSecretStore has no namespace of its own, so the ConfigMap
        # holding the API server CA must be named with one. kube-root-ca.crt is
        # injected into every namespace; openshift-config is simply the one this
        # store already reads.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: openshift-config
      auth:
        serviceAccount:
          name: pull-secret-reader
          namespace: openshift-config
