---
# Credentials MTV uses to reach the lab vCenter.
#
# MTV'S KEY NAMES DIFFER FROM ACM'S FOR THE SAME VALUES. The ACM credential in
# manifests/config/rhacm calls it `username`; MTV calls it `user`. The two
# Secrets hold identical data and are NOT interchangeable. ESO does the renaming
# here, which is the whole reason both can share one 1Password item.
#
#   MTV key             1Password vcenter/...
#   user                username        <- note the name change
#   password            password
#   cacert              cacertificate
#
# NO THUMBPRINT, DELIBERATELY. MTV also accepts a `thumbprint` — the SHA-1 of the
# certificate vCenter serves — but it is not required when a valid CA is supplied
# and insecureSkipVerify is false. Verified on hub 2026-08-16 with a throwaway
# Provider carrying no thumbprint:
#   ConnectionTestSucceeded=True  "Connection test, succeeded."
#   InventoryCreated=True         "The inventory has been loaded."
# Omitting it matters because a thumbprint pins the LEAF certificate, which
# expires 2028-05-11, while the CA runs to 2036-05-06. Pinning the leaf would
# plant a migration-breaking expiry two years earlier than necessary, for no
# security gain over verifying against the CA.
#
# insecureSkipVerify is explicitly "false" rather than omitted. Per the MTV docs
# the certificate is ignored entirely when it is true, which would silently make
# cacert decorative — exactly the kind of setting that should be stated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vsphere-lab
  namespace: openshift-mtv
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: vsphere-lab
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        # How the MTV console recognises this as provider credentials.
        labels:
          createdForProviderType: vsphere
          createdForResourceType: providers
      data:
        user: "{{ .username }}"
        password: "{{ .password }}"
        cacert: "{{ .cacert }}"
        insecureSkipVerify: "false"
  data:
    - secretKey: username
      remoteRef:
        key: vcenter/username
    - secretKey: password
      remoteRef:
        key: vcenter/password
    # The CA that signs vCenter's TLS certificate. vCenter serves only its leaf,
    # so this came from https://vcenter.lab.bewley.net/certs/download.zip — that
    # bundle holds four CAs and only one verifies the leaf, identified with
    # `openssl verify` rather than by matching subject strings since three share
    # a similar CN. SHA-256 A5:0F:C9:3E:…, valid to 2036-05-06.
    - secretKey: cacert
      remoteRef:
        key: vcenter/cacertificate
