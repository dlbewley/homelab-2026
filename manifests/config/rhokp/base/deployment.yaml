---
# Red Hat Offline Knowledge Portal: a local copy of the Customer Portal's
# documentation, solutions and articles, served on 8080.
#
# Shape follows Red Hat's "How to deploy the Offline Knowledge Portal on
# OpenShift" (developers.redhat.com, 2025-10-03): one container, ACCESS_KEY
# from a Secret, port 8080. Unlike that article this pulls straight from
# registry.redhat.io — the hub is connected, and the cluster's global pull
# secret already authenticates to it, so no mirror and no imagePullSecrets.
#
# The image is pinned by the digest of its multi-arch manifest list, so each
# node pulls its own architecture. It is big: measured on the hub 2026-11-15,
# 10.0 GB pulled to cnv-3 in 13m47s. A pod landing on a node without the image
# is down that long; probes only start once the container does, so the pull
# does not count against them.
#
# Inside, httpd serves the portal on 8080 and fronts Solr (8983, localhost)
# and an MCP search server (3001, localhost) at /mcp. At each start the
# container unpacks its Solr index into the writable layer; Solr is answering
# about 20 s after the container starts, ~90 s end to end.
#
# Runs under the default restricted-v2 SCC with an arbitrary UID (verified);
# nothing here asks for more. Stateless: no volume, the content ships inside
# the image. Updating the content means bumping the digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rhokp
  namespace: rhokp
  labels:
    app: rhokp
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rhokp
  template:
    metadata:
      labels:
        app: rhokp
    spec:
      containers:
        - name: rhokp
          image: registry.redhat.io/offline-knowledge-portal/rhokp-rhel9@sha256:541b04ab7cc6d5995d50e754fe36c179dd9c1d2a1d74d304b8318746d340ea76
          env:
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: access-key
                  key: access-key
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # TCP rather than HTTP checks: Red Hat documents no health endpoint.
          # Startup allows 10 minutes; the measured start is about 90 seconds.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          # Red Hat publishes no sizing. Measured on the hub: ~1.6 Gi resident,
          # ~4 cores for the first minute while Solr loads its index, then
          # ~26m idle. No CPU limit, so that first minute is not throttled.
          resources:
            requests:
              cpu: 250m
              memory: 2Gi
            limits:
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
