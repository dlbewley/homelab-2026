---
# The RHOKP access key, which unlocks the portal's full content.
#
#   1Password  eso / RHOKP / credential
#        │  ClusterSecretStore 1password-sdk
#        ▼
#   rhokp/access-key     key: access-key   ->  env ACCESS_KEY in the Deployment
#
# MANUAL STEP: generate the key at https://access.redhat.com/offline/access
# (needs a Red Hat login and a subscription that includes RHOKP) and store it
# in the `eso` vault as item `RHOKP`, field `credential`.
#
# Until the item exists this reports SecretSyncedError and the pod waits in
# CreateContainerConfigError — expected order, not a fault.
#
# To rotate: generate a new key, update the 1Password item; External Secrets
# picks it up within the hour, but the pod reads it only at start, so
# `oc rollout restart deployment/rhokp -n rhokp` afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: access-key
  namespace: rhokp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: access-key
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        # <item>/<field>, in the store's vault.
        key: RHOKP/credential
