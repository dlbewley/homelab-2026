---
# Consumes the 'local-block' PVs created by the LocalVolumeSet.
#
# Sizing lives in the overlay. This base only describes shape: one device set,
# 3 replicas, non-portable OSDs (a local disk cannot follow a pod to another
# node), flexible scaling so failure domain is host rather than rack.
apiVersion: ocs.openshift.io/v1
kind: StorageCluster
metadata:
  name: ocs-storagecluster
  namespace: openshift-storage
spec:
  flexibleScaling: true
  monDataDirHostPath: /var/lib/rook
  arbiter: {}
  encryption:
    kms: {}
  externalStorage: {}
  # Only fields present in the CRD schema may appear here. ArgoCD syncs this
  # with server-side apply, which rejects unknown fields outright rather than
  # ignoring them:
  #   failed to create typed patch object ... field not declared in schema
  # Check before adding one:
  #   oc get crd storageclusters.ocs.openshift.io -o json | jq -r \
  #     '.spec.versions[]|select(.name=="v1").schema.openAPIV3Schema.properties.spec.properties.managedResources.properties|keys[]'
  # (cephConfig was valid in older ODF releases but is not in 4.22.)
  managedResources:
    cephBlockPools: {}
    cephFilesystems: {}
    cephObjectStoreUsers: {}
    cephObjectStores: {}
  multiCloudGateway:
    reconcileStrategy: manage
  storageDeviceSets:
    - name: ocs-deviceset
      count: 1
      replica: 3
      portable: false
      placement: {}
      dataPVCTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          volumeMode: Block
          storageClassName: local-block
          resources:
            requests:
              storage: "1Ti"
