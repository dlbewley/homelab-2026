---
# Thanos-backed metrics across managed clusters.
#
# EVERY STORAGE SIZE IS SET EXPLICITLY, AND THAT IS THE POINT OF THIS FILE.
# The CRD carries defaults — compact 100Gi, receive 100Gi, store 10Gi, rule 1Gi,
# alertmanager 1Gi — so omitting storageConfig does not get you small PVCs, it
# gets you 212Gi. These are also per-replica, so the real figure is higher still.
# Measured on hub 2026-08-13, Ceph offers roughly 1024GiB usable; the defaults
# would claim a fifth of the cluster to observe a hub that currently observes
# only itself.
#
# This is the same trap as Search's dbStorage in manifests/config/rhacm: a field
# left unset does not mean "no opinion", it means "the CRD's opinion". State the
# values.
#
# Sized for a hub watching one or two clusters. compact and receive are cut
# hardest because they scale with retention and ingest rather than cluster count;
# store, rule and alertmanager are already small at their defaults. Revisit when
# homelab-2026-4pq.9 adds a spoke and real consumption is visible — that is a
# better moment to size than guessing now.
#
# storageClass is named rather than relying on the cluster default, for the same
# reason it is named on Search: a default that changes silently relocates data.
#
# imagePullPolicy is deliberately unset. The catalog pins it to Always, which
# defeats image caching for no benefit on an operator whose channel is pinned.
#
# SkipDryRunOnMissingResource because this CRD arrives with ACM's observability
# component, after MultiClusterHub reports Running — a separate Application, so
# ordering is by retry rather than sync wave.
apiVersion: observability.open-cluster-management.io/v1beta2
kind: MultiClusterObservability
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # TECH PREVIEW. These fields drive the multicluster-observability-addon, which
  # is how ACM delivers fleet-wide Perses dashboards. Treat the shape as unstable
  # across ACM releases — this repo pins the ACM channel precisely so an upgrade
  # that changes them is a deliberate, reviewable step.
  #
  # DECLARED HERE BECAUSE THEY WERE ALREADY LIVE AND UNTRACKED. Enabled by hand on
  # 2026-08-17 (spec.capabilities was owned by `kubectl-edit`), while git declared
  # no capabilities at all. Since the CR is applied with server-side apply and
  # ArgoCD owns only the fields git names, none of this was being reconciled: it
  # would have survived indefinitely and then vanished on a rebuild.
  #
  # Declaring identical values is safe even though another manager owns the field.
  # Server-side apply makes a second manager a CO-OWNER when the value matches,
  # and only conflicts when it differs — verified with a dry-run as
  # argocd-controller before committing. That is the opposite of the image
  # registry Config, where values differed and ServerSideApply had to be disabled.
  #
  # metrics.ui DEPENDS ON THE CLUSTER OBSERVABILITY OPERATOR, which is installed
  # by the separate cluster-observability component. The CRD says so directly —
  # "enable UI through COO on the hub" — and the addon's own config confirms the
  # wiring: platformMetricsUI=uiplugins.v1alpha1.observability.openshift.io, the
  # COO API. Two Applications, so ordering is by retry. The failure mode is quiet:
  # with COO absent the capability stays true and nothing renders.
  # WHAT IS DELIBERATELY NOT DECLARED: spec.capabilities.platform.analytics.
  # Both right-sizing recommendation fields are true on this cluster, but field
  # ownership shows they were written by mco-operator at 2026-08-13T23:14:02Z —
  # MCO install time, three days before the metrics fields were set by hand. They
  # are OPERATOR DEFAULTS, not anyone's decision, so restating them here would pin
  # a value the operator chose and silently override a future ACM release that
  # changed it. clusters/hub/config.yaml makes the same argument about CRD
  # defaults generally.
  #
  # Note the addon reports platformNamespaceRightSizing=disabled and
  # platformVirtualizationRightSizing=disabled in
  # addondeploymentconfig/multicluster-observability-addon despite those fields
  # being true, and the grafana-dashboard-acm-right-sizing-* ConfigMaps predate
  # them by three days — so the fields being true is not evidence the feature is
  # active. See homelab-2026-4pq.36.
  capabilities:
    platform:
      metrics:
        # Collect and forward metrics from fleet managed clusters.
        default:
          enabled: true
        # Fleet-wide Perses dashboards, served through COO.
        ui:
          enabled: true
  instanceSize: minimal
  observabilityAddonSpec:
    enableMetrics: true
    interval: 300
  storageConfig:
    metricObjectStorage:
      name: thanos-object-storage
      key: thanos.yaml
    storageClass: ocs-storagecluster-ceph-rbd
    compactStorageSize: 50Gi
    receiveStorageSize: 20Gi
    storeStorageSize: 10Gi
    ruleStorageSize: 1Gi
    alertmanagerStorageSize: 1Gi
