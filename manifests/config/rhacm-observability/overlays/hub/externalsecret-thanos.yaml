---
# Builds the thanos.yaml object-storage config MultiClusterObservability expects.
#
# THIS REPLACES THE CATALOG'S SETUP JOB, which polled for the OBC Secret in a
# bash while-loop and piped interpolated YAML into `oc create -f -`. That Job
# runs once: if the OBC is recreated and credentials rotate, nothing re-runs and
# the drift is invisible. This reconciles continuously and ArgoCD can see it.
#
# Only the two credentials come from the cluster. Bucket, endpoint and TLS
# posture are literals here because they are decisions, and decisions belong in
# git where they can be reviewed — not string-interpolated inside a shell script.
#
# ON `insecure` — this is the field most likely to be miscopied. In Thanos,
# `insecure: true` means SPEAK PLAIN HTTP INSTEAD OF HTTPS. It does NOT mean
# "skip certificate verification"; that is http_config.tls_config.
# insecure_skip_verify. The catalog sets insecure: true, so the catalog talks
# plaintext to its S3 endpoint.
#
# This cluster does better. Checked from inside the cluster on 2026-08-13, the
# RGW service does serve TLS on :443:
#   subject=CN=rook-ceph-rgw-ocs-storagecluster-cephobjectstore.openshift-storage.svc
#   issuer=CN=openshift-service-serving-signer@1785106755
# so traffic is encrypted. Verification is skipped only because that issuer is
# the service-serving CA, published as a ConfigMap, and ESO cannot read
# ConfigMaps to turn it into the Secret a ca_file would need.
#
# To verify properly later: put the service CA in a Secret, point
# MultiClusterObservability's storageConfig.metricObjectStorage.tlsSecretName /
# tlsSecretMountPath at it, set http_config.tls_config.ca_file to the mounted
# path and drop insecure_skip_verify.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-object-storage
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: obc-credentials
    kind: SecretStore
  target:
    name: thanos-object-storage
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        thanos.yaml: |
          type: s3
          config:
            bucket: homelab-hub-thanos
            endpoint: rook-ceph-rgw-ocs-storagecluster-cephobjectstore.openshift-storage.svc:443
            insecure: false
            http_config:
              tls_config:
                insecure_skip_verify: true
            access_key: {{ .accessKey | quote }}
            secret_key: {{ .secretKey | quote }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: thanos-object-storage-obc
        property: AWS_ACCESS_KEY_ID
    - secretKey: secretKey
      remoteRef:
        key: thanos-object-storage-obc
        property: AWS_SECRET_ACCESS_KEY
