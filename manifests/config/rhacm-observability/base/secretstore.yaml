---
# Reads Secrets from THIS cluster, unlike the ClusterSecretStore in
# manifests/config/external-secrets which reads 1Password.
#
# A namespaced SecretStore rather than a ClusterSecretStore on purpose: the only
# thing it may read is one Secret in one namespace, and a namespaced store makes
# that boundary structural instead of a matter of Role wording.
#
# The credentials are generated in-cluster by the ObjectBucketClaim, so 1Password
# never sees them and there is nothing to rotate by hand — delete the OBC and the
# whole chain re-derives.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: obc-credentials
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    kubernetes:
      remoteNamespace: open-cluster-management-observability
      server:
        # Every namespace gets kube-root-ca.crt injected, so the API server's CA
        # needs no ExternalSecret of its own.
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: thanos-obc-reader
