---
# THE 39-POD CASE. The observability operator stamps
# `multiclusterhub-operator-pull-secret` into every pod it creates, whether or
# not MultiClusterObservability.spec.imagePullSecret is set — it is empty here
# and the CRD has no default, so the name is the operator's own.
#
# Setting MCH.spec.imagePullSecret does NOT reach this namespace. Verified on hub
# 2026-08-16: the Secret existed in open-cluster-management and MCH pointed at
# it, yet this namespace had no copy and kubelet kept logging
# FailedToRetrieveImagePullSecret once per pod.
#
# Nothing was broken by its absence — the node-level cluster pull secret already
# covers registry.redhat.io and no pod ever entered ImagePullBackOff. This exists
# to remove 39 recurring warnings, because that volume of noise is what hides the
# next real failure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multiclusterhub-operator-pull-secret
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openshift-config-pullsecret
    kind: ClusterSecretStore
  target:
    name: multiclusterhub-operator-pull-secret
    # MERGE, NOT OWNER — and this was found the hard way. With Owner, ESO tries
    # to hold an ownerReference on the target Secret, and MCO ADOPTS that Secret:
    # observed on hub 2026-08-16, MCO added its own ownerReference
    # (MultiClusterObservability/observability) plus its backup label to the
    # Secret ESO had created minutes earlier. ESO then refused to manage it:
    #
    #   Ready=False  SecretSyncedError  failed to take ownership of target secret
    #
    # which surfaced as hub-cfg-rhacm-observability going Degraded in ArgoCD while
    # nothing was actually broken — the Secret existed with correct content and
    # no pod ever complained.
    #
    # Merge splits the responsibilities the way the two controllers actually want
    # them: MCO owns the object's lifecycle, ESO keeps .dockerconfigjson current
    # so a rotation of openshift-config/pull-secret still reaches this namespace.
    #
    # Only THIS namespace needs it. The identical ExternalSecrets in
    # open-cluster-management and cnpg-system are Ready with ESO holding the
    # ownerReference, because nothing there adopts their Secrets.
    #
    # Trade-off worth knowing: Merge does not CREATE the Secret. If it is ever
    # deleted, ESO will not recreate it — whether MCO does is untested.
    creationPolicy: Merge
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: pull-secret
        property: .dockerconfigjson
