---
# THE 39-POD CASE. The observability operator stamps
# `multiclusterhub-operator-pull-secret` into every pod it creates, whether or
# not MultiClusterObservability.spec.imagePullSecret is set — it is empty here
# and the CRD has no default, so the name is the operator's own.
#
# Setting MCH.spec.imagePullSecret does NOT reach this namespace. Verified on hub
# 2026-08-16: the Secret existed in open-cluster-management and MCH pointed at
# it, yet this namespace had no copy and kubelet kept logging
# FailedToRetrieveImagePullSecret once per pod.
#
# Nothing was broken by its absence — the node-level cluster pull secret already
# covers registry.redhat.io and no pod ever entered ImagePullBackOff. This exists
# to remove 39 recurring warnings, because that volume of noise is what hides the
# next real failure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: multiclusterhub-operator-pull-secret
  namespace: open-cluster-management-observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openshift-config-pullsecret
    kind: ClusterSecretStore
  target:
    name: multiclusterhub-operator-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: pull-secret
        property: .dockerconfigjson
