---
# The GitHub OAuth App's client secret.
#
# Same shape and same silent failure as the Keycloak one: the Secret must live
# in openshift-config under the key `clientSecret` exactly, or from the OAuth
# CRD — "If the secret or expected key is not found, the identity provider is
# not honored." The provider simply disappears from the login page.
#
# Created by scripts/create-github-oauth-secret.sh, which reads the value from a
# hidden prompt rather than an argument. The matching client ID is not secret
# and is committed in oauth.yaml, because the OAuth CR takes it as a plain
# string with no secret-reference option.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-client-secret
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: github-client-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        # <item>/<field> — the onepasswordSDK form.
        key: github-oauth-hub/client-secret
