---
# The ocp-hub client secret, delivered to where OpenShift expects it.
#
# Same 1Password field the realm import uses for the client's own `secret`, so
# both sides of the OIDC handshake come from one source and cannot drift.
#
# The Secret must live in openshift-config and use the key `clientSecret`
# exactly. From the OAuth CRD:
#   "The key "clientSecret" is used to locate the data. If the secret or
#    expected key is not found, the identity provider is not honored."
# A wrong key is therefore silent — login simply never offers Keycloak.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client-secret
  namespace: openshift-config
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: 1password-sdk
    kind: ClusterSecretStore
  target:
    name: keycloak-client-secret
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        # <item>/<field> — the onepasswordSDK form. An item name plus a separate
        # `property:` is the Connect provider's shape and fails to parse here.
        key: keycloak-homelab/ocp-hub-client-secret
