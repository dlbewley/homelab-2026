---
# Which operators the 'hub' cluster gets.
#
# Adding an operator to this cluster is one element below. Removing one is
# deleting that element — the generated Application goes away and, because
# prune is on for this layer, so do its Subscription/OperatorGroup/Namespace.
#
# Every element points at THIS repo. If a component wants upstream content
# (redhat-cop/gitops-catalog, for example) it pulls it in as a remote base from
# inside manifests/olm/<name>/base/kustomization.yaml. Keeping one repoURL here
# means a fork is a single edit per file rather than one per component.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-operators
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: nmstate
            namespace: openshift-nmstate
            path: manifests/olm/nmstate/base
          - name: metallb
            namespace: metallb-system
            path: manifests/olm/metallb/base
          - name: local-storage
            namespace: openshift-local-storage
            path: manifests/olm/local-storage/base
          - name: odf
            namespace: openshift-storage
            path: manifests/olm/odf/base
          - name: virtualization
            namespace: openshift-cnv
            path: manifests/olm/virtualization/base
          # AllNamespaces-only, so its OperatorGroup uses `spec: {}` rather than
          # targetNamespaces. The operator runs in external-secrets-operator;
          # its operand lands in external-secrets. See
          # manifests/config/external-secrets/README.md.
          - name: external-secrets
            namespace: external-secrets-operator
            path: manifests/olm/external-secrets/base
          # Red Hat Connectivity Link (Kuadrant). AllNamespaces-only: its
          # policies attach to Gateways and HTTPRoutes in other namespaces.
          # Required by RHOAI Models-as-a-Service. The Kuadrant instance is
          # in the config layer.
          - name: connectivity-link
            namespace: kuadrant-system
            path: manifests/olm/connectivity-link/base
          - name: cert-manager
            namespace: cert-manager-operator
            path: manifests/olm/cert-manager/base
          # AllNamespaces: it manages Postgres Clusters in its consumers'
          # namespaces, not its own. Keycloak is not the only consumer — see
          # manifests/config/cloudnative-pg/README.md before removing this.
          - name: cloudnative-pg
            namespace: cnpg-system
            path: manifests/olm/cloudnative-pg/base
          # OwnNamespace/SingleNamespace ONLY — no AllNamespaces support.
          - name: keycloak
            namespace: keycloak
            path: manifests/olm/keycloak/base
          # Repo-wide catalog serving Bewley-built operators. Its own
          # component so a prune of any one operator cannot remove it.
          - name: bewley-catalog
            namespace: openshift-marketplace
            path: manifests/olm/bewley-catalog/base
          # AllNamespaces: the collector probes openshift-ovn-kubernetes and
          # openshift-frr-k8s, so it must act outside its own namespace.
          - name: ovn-recon
            namespace: ovn-recon
            path: manifests/olm/ovn-recon/overlays/hub
          # OwnNamespace ONLY — the most restrictive install mode here, so the
          # OperatorGroup must set targetNamespaces.
          - name: rhacm
            namespace: open-cluster-management
            path: manifests/olm/rhacm/base
          # OwnNamespace ONLY, same as rhacm.
          - name: mtv
            namespace: openshift-mtv
            path: manifests/olm/mtv/base
          # TWO operators (node-healthcheck + self-node-remediation) sharing
          # ONE OperatorGroup, because a namespace may only have one. Both are
          # AllNamespaces, so it uses `spec: {}`.
          - name: workload-availability
            namespace: openshift-workload-availability
            path: manifests/olm/workload-availability/base
          # AllNamespaces, so `spec: {}`. Named OperatorGroup deliberately —
          # the console generates one with a random suffix.
          - name: cluster-observability
            namespace: openshift-cluster-observability-operator
            path: manifests/olm/cluster-observability/base
          # OwnNamespace/SingleNamespace only, so targetNamespaces — the same
          # shape as rhacm and mtv, not the `spec: {}` used above.
          - name: descheduler
            namespace: openshift-kube-descheduler-operator
            path: manifests/olm/descheduler/base
          # Red Hat OpenShift AI. AllNamespaces-only. Pinned to stable-3.5,
          # which is NOT the catalog default — see the Subscription. The
          # operator alone deploys nothing; the DataScienceCluster is config.
          - name: rhoai
            namespace: redhat-ods-operator
            path: manifests/olm/rhoai/base
          # Red Hat build of OpenTelemetry. AllNamespaces-only. Here for RHOAI's
          # observability stack, which needs it to run its metrics collector.
          # Its CRDs already exist on the hub, put there by ACM — see the
          # Subscription.
          - name: opentelemetry
            namespace: openshift-opentelemetry-operator
            path: manifests/olm/opentelemetry/base
  template:
    metadata:
      name: 'hub-olm-{{ .name }}'
      labels:
        homelab.bewley.net/cluster: hub
        homelab.bewley.net/layer: olm
        homelab.bewley.net/component: '{{ .name }}'
    spec:
      project: hub
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      source:
        repoURL: https://github.com/dlbewley/homelab-2026.git
        targetRevision: main
        path: '{{ .path }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # The component declares its own Namespace so it can carry the
          # cluster-monitoring label; do not let ArgoCD create a bare one.
          - CreateNamespace=false
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
