---
# What the 'hub' cluster is configured to be, once the operators from
# operators.yaml are installed.
#
# ORDERING: these Applications are created by the ApplicationSet controller
# directly, not synced by a parent Application, so sync-wave annotations do NOT
# order them relative to each other or to the operator layer. Convergence is by
# retry instead: an Application whose CRD does not exist yet fails, backs off
# and succeeds once the operator lands. That is the same loop as the "apply
# again until no errors" note in the old runbook, just automated. If you ever
# need strict ordering, add a RollingSync strategy here.
#
# Path convention: overlays/hub when the component has cluster-specific values,
# base when it does not.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-config
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          # Must land before ODF: the LocalVolumeSet and StorageCluster both
          # select nodes by the label this applies.
          - name: node-labels
            namespace: default
            path: manifests/config/node-labels/overlays/hub
          - name: nmstate
            namespace: openshift-nmstate
            path: manifests/config/nmstate/overlays/hub
          - name: metallb
            namespace: metallb-system
            path: manifests/config/metallb/overlays/hub
          - name: local-storage
            namespace: openshift-local-storage
            path: manifests/config/local-storage/overlays/hub
          - name: odf
            namespace: openshift-storage
            path: manifests/config/odf/overlays/hub
          - name: virtualization
            namespace: openshift-cnv
            path: manifests/config/virtualization/base
          # ExternalSecretsConfig creates the `external-secrets` operand
          # namespace; the ClusterSecretStore stays Ready=False until the
          # service-account token secret is created there by hand. That step is
          # deliberate — it is the credential that unlocks every other
          # credential, so it cannot be committed or fetched by External
          # Secrets itself. See manifests/config/external-secrets/README.md.
          - name: external-secrets
            namespace: external-secrets-operator
            path: manifests/config/external-secrets/overlays/hub
          # Operator in cert-manager-operator, operand in cert-manager.
          # Wires the router at sync wave 20; see the component README.
          - name: cert-manager
            namespace: cert-manager-operator
            path: manifests/config/cert-manager/overlays/hub
          # Depends on cloudnative-pg and cert-manager being installed, and
          # on the homelab-ca issuer being Ready. Those are separate
          # Applications, so ordering here is by retry, not sync wave.
          - name: keycloak
            namespace: keycloak
            path: manifests/config/keycloak/overlays/hub
          - name: ovn-recon
            namespace: ovn-recon
            path: manifests/config/ovn-recon/overlays/hub
          # MultiClusterHub deploys a lot and is slow to report Running.
          # Judge it by `oc get multiclusterhub`, not by ArgoCD.
          - name: rhacm
            namespace: open-cluster-management
            path: manifests/config/rhacm/overlays/hub
          # Adds Keycloak as an identity provider. Depends on the realm
          # (hub-cfg-keycloak) and on the trust-manager Bundle in
          # hub-cfg-cert-manager putting homelab-ca into openshift-config.
          - name: oauth
            namespace: openshift-config
            path: manifests/config/oauth/overlays/hub
  template:
    metadata:
      name: 'hub-cfg-{{ .name }}'
      labels:
        homelab.bewley.net/cluster: hub
        homelab.bewley.net/layer: config
        homelab.bewley.net/component: '{{ .name }}'
    spec:
      project: hub
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      source:
        repoURL: https://github.com/dlbewley/homelab-2026.git
        targetRevision: main
        path: '{{ .path }}'
      syncPolicy:
        automated:
          # Pruning is on for the layer, but individual resources can opt out.
          # The Node objects in manifests/config/node-labels carry
          #   argocd.argoproj.io/sync-options: Prune=false,Delete=false
          # because they predate ArgoCD and must never be deleted by it.
          # (Opting out per resource rather than per Application because
          # syncPolicy.automated.prune is a bool in the CRD and cannot be
          # templated from a generator element.)
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          # Operators own large parts of these CRs (HyperConverged and
          # StorageCluster in particular). Server-side apply lets ArgoCD own
          # only the fields git declares instead of overwriting the whole object.
          - ServerSideApply=true
        retry:
          limit: 20
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
      # Fields the API server fills in that git deliberately does not set.
      #
      # ServerSideApply above is what makes these visible: ArgoCD compares what
      # it would apply against the live object, and CRD defaults materialise on
      # the live side only. The resource is Healthy and functioning — it simply
      # never reports Synced, which trains people to ignore OutOfSync.
      #
      # Verified on hub 2026-08-07: adding exactly these paths took
      # hub-cfg-keycloak from OutOfSync to Synced with no other change.
      #
      # Prefer this to restating defaults in the manifests. Declaring them would
      # also work, but adds boilerplate to every entry of every ExternalSecret
      # and has to be repeated for each new one.
      #
      # Scoped by group and kind, and to named leaf fields rather than whole
      # objects, so genuine drift in `key`, `secretKey` or the store reference
      # is still reported.
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.data[].remoteRef.nullBytePolicy
            - .spec.target.deletionPolicy
